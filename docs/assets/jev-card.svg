<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" font-family="Helvetica Neue, Helvetica, Arial Unicode MS, PingFang SC, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#101B31"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1600" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="8" fill="url(#accent)"/>

  <!-- Header -->
  <text x="80" y="120" fill="#60A5FA" font-size="26" letter-spacing="7" font-weight="700">JEV · BLACK-BOX BENCHMARK</text>
  <text x="80" y="222" fill="#F8FAFC" font-size="68" font-weight="800">A decision model for</text>
  <text x="80" y="306" fill="#F8FAFC" font-size="68" font-weight="800">agent harnesses</text>
  <text x="80" y="378" fill="#94A3B8" font-size="30">22,500 API calls · 10 public datasets · $2.19 total · ~0.3s per call</text>

  <!-- Left panel -->
  <rect x="80" y="440" width="700" height="700" rx="20" fill="#0F1E33" stroke="#1E3A5F" stroke-width="2"/>
  <rect x="80" y="440" width="10" height="700" rx="5" fill="#34D399"/>
  <text x="128" y="520" fill="#34D399" font-size="34" font-weight="800">WORKS WELL</text>

  <text x="128" y="610" fill="#F1F5F9" font-size="31" font-weight="700">Injection detection</text>
  <text x="728" y="610" fill="#34D399" font-size="31" font-weight="800" text-anchor="end">P/R 100%</text>
  <line x1="128" y1="646" x2="728" y2="646" stroke="#1E293B" stroke-width="2"/>

  <text x="128" y="726" fill="#F1F5F9" font-size="31" font-weight="700">Reranking</text>
  <text x="728" y="726" fill="#34D399" font-size="31" font-weight="800" text-anchor="end">MRR 0.62 → 0.84</text>
  <line x1="128" y1="762" x2="728" y2="762" stroke="#1E293B" stroke-width="2"/>

  <text x="128" y="842" fill="#F1F5F9" font-size="31" font-weight="700">Tool catalog routing</text>
  <text x="728" y="842" fill="#34D399" font-size="31" font-weight="800" text-anchor="end">96.5%</text>
  <line x1="128" y1="878" x2="728" y2="878" stroke="#1E293B" stroke-width="2"/>

  <text x="128" y="958" fill="#F1F5F9" font-size="31" font-weight="700">Shell risk gate</text>
  <text x="728" y="958" fill="#34D399" font-size="31" font-weight="800" text-anchor="end">100% / 1.8%</text>
  <text x="128" y="1002" fill="#64748B" font-size="24">caught · false alarm</text>

  <text x="128" y="1090" fill="#64748B" font-size="24">199-tool catalog · InjecAgent · SciFact</text>

  <!-- Right panel -->
  <rect x="820" y="440" width="700" height="700" rx="20" fill="#1A1220" stroke="#5F2130" stroke-width="2"/>
  <rect x="1510" y="440" width="10" height="700" rx="5" fill="#F87171"/>
  <text x="868" y="520" fill="#F87171" font-size="34" font-weight="800">DOES NOT WORK</text>

  <text x="868" y="610" fill="#F1F5F9" font-size="31" font-weight="700">Model-difficulty routing</text>
  <text x="1468" y="610" fill="#F87171" font-size="31" font-weight="800" text-anchor="end">51%</text>
  <line x1="868" y1="646" x2="1468" y2="646" stroke="#3F1D28" stroke-width="2"/>

  <text x="868" y="726" fill="#F1F5F9" font-size="31" font-weight="700">Trajectory attribution</text>
  <text x="1468" y="726" fill="#F87171" font-size="31" font-weight="800" text-anchor="end">AUROC 0.56</text>
  <line x1="868" y1="762" x2="1468" y2="762" stroke="#3F1D28" stroke-width="2"/>

  <text x="868" y="842" fill="#F1F5F9" font-size="31" font-weight="700">Non-English</text>
  <text x="1468" y="842" fill="#F87171" font-size="31" font-weight="800" text-anchor="end">48.9% vs 61.5%</text>
  <line x1="868" y1="878" x2="1468" y2="878" stroke="#3F1D28" stroke-width="2"/>

  <text x="868" y="958" fill="#F1F5F9" font-size="31" font-weight="700">Hard limits</text>
  <text x="1468" y="958" fill="#F87171" font-size="31" font-weight="800" text-anchor="end">255 / 32k / text</text>
  <text x="868" y="1002" fill="#64748B" font-size="24">choices · context · modalities</text>

  <text x="868" y="1090" fill="#64748B" font-size="24">RouterBench · Who&When · KO vs EN</text>

  <!-- Lesson -->
  <rect x="80" y="1200" width="1440" height="250" rx="20" fill="#0F1E33" stroke="#1E3A5F" stroke-width="2"/>
  <text x="128" y="1282" fill="#F8FAFC" font-size="40" font-weight="800">Let choice compete. Then let noul verify.</text>
  <text x="128" y="1344" fill="#60A5FA" font-size="32" font-weight="700">Skill routing R@1: 38% → 76%   ·   multi-skill: 9% → 81%</text>
  <text x="128" y="1398" fill="#94A3B8" font-size="27">Model gives calibrated local judgments; code holds the control flow.</text>

  <!-- Footer -->
  <text x="80" y="1536" fill="#60A5FA" font-size="27" font-weight="700">github.com/Aitejiu/jev-harness-lab</text>
  <text x="1520" y="1536" fill="#64748B" font-size="25" text-anchor="end">jev-1.13.0 · Sep 2026</text>
</svg>
