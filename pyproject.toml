[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-mcp"
version = "0.1.2"
description = "MCP server exposing TypeSafe Jev judgments for agent harnesses: injection scanning, shell risk gating, candidate ranking"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aitejiu" }]
keywords = ["mcp", "model-context-protocol", "typesafe", "jev", "guardrails", "agent"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  "mcp>=2.2",
  "typesafe-sdk>=0.7",
]

[project.urls]
Homepage = "https://github.com/Aitejiu/jev-harness-lab"
Repository = "https://github.com/Aitejiu/jev-harness-lab"

[project.scripts]
jev-mcp = "jev_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_mcp"]
